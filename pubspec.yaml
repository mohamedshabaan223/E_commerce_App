name: ecommerce_app
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.13.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  pinput: ^5.0.0
  pin_code_fields: ^10.1.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.2
  file_picker: ^13.3.1
  timeline_tile: ^2.0.0
  google_fonts: ^9.0.0
  dio: ^5.11.1
  pretty_dio_logger: ^1.4.0

  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^11.2.0
  dartz: ^0.10.1
  equatable: ^3.0.0
  bloc: ^9.2.1
  fluttertoast: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

  fonts:
    - family: DMSerifDisplay
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Italic.ttf
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf
          style: italic
